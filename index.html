<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水蛇洞經紀人</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #19141e; color: #f4e9da; font: 16px system-ui, sans-serif; }
    main { width: min(1280px, calc(100vw - 24px), calc((100svh - 70px) * 16 / 9)); }
    #game { position: relative; aspect-ratio: 16 / 9; background: #100d14; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #game:fullscreen { width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; margin: 0; padding: 16px; display: grid; place-items: center; text-align: center; }
    #status[hidden] { display: none; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
    button { border: 1px solid #94778d; border-radius: 4px; background: #312638; color: inherit; padding: 6px 12px; font: inherit; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <main>
    <div id="game">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="水蛇洞經紀人遊戲畫面"></canvas>
      <p id="status" role="status">正在載入水蛇洞經紀人…</p>
    </div>
    <footer>
      <span>水蛇洞經紀人</span>
      <button id="fullscreen" type="button" disabled>全螢幕</button>
    </footer>
  </main>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const status = document.getElementById("status");
    const fullscreen = document.getElementById("fullscreen");
    const config = {
      dataUrl: "Build/01931d74712e67d03c3a8c6ae759d2c5.data.unityweb",
      frameworkUrl: "Build/4929914c4c7bf77736786136b969bb43.framework.js.unityweb",
      codeUrl: "Build/d422e6dc58b7c37876201fe3aca68884.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "game",
      companyName: "SSD Studio",
      productName: "水蛇洞經紀人",
      productVersion: "1.0",
      autoSyncPersistentDataPath: true
    };

    function showLoadError(error) {
      console.error(error);
      status.textContent = "遊戲載入失敗。請使用支援 WebGL 2 的瀏覽器重新整理。";
    }

    const loader = document.createElement("script");
    loader.src = "Build/dbcd0920505ce813933a63c1e75728bc.loader.js";
    loader.onerror = showLoadError;
    loader.onload = () => {
      createUnityInstance(canvas, config, progress => {
        status.textContent = `正在載入水蛇洞經紀人… ${Math.round(progress * 100)}%`;
      }).then(game => {
        status.hidden = true;
        fullscreen.disabled = false;
        fullscreen.onclick = () => game.SetFullscreen(1);
      }).catch(showLoadError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
